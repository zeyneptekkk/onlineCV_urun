{% extends "saas_base.html" %}

{% block title %}Yeni CV Oluştur - OnlineCV{% endblock %}

{% block content %}
<div class="container py-4">
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="mb-4">Yeni CV Oluştur</h2>
        
        <form method="POST" class="card">
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">CV Başlığı</label>
                    <input type="text" class="form-control" name="title" value="Benim CV'm" required>
                    <small class="text-muted">Bu başlık sadece sizin göreceğiniz isimdir</small>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Ad Soyad</label>
                    <input type="text" class="form-control" name="full_name" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Meslek/Ünvan</label>
                    <input type="text" class="form-control" name="job_title">
                </div>
                
                <button type="submit" class="btn btn-primary">Oluştur</button>
                <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary">İptal</a>
            </div>
        </form>
    </div>
</div>
</div>

{% endblock %}
