{% extends "admin/base.html" %}
{% block title %}QR Kod{% endblock %}

{% block content %}
<div class="admin-header">
  <h1>QR Kod</h1>
  <p class="text-muted mb-0">Mülakatlarınızda göstermek için QR kodu indirin.</p>
</div>

<div class="form-card text-center" style="max-width:420px;">
  <img src="data:image/png;base64,{{ qr_image }}"
       alt="QR Kod" class="img-fluid mb-3"
       style="max-width:280px; border-radius:12px; border:1px solid var(--border);">
  <p class="text-muted small mb-3">Bu QR kodu tarayan kişi doğrudan CV sitenize yönlendirilir.</p>
  <div class="mb-3">
    <code class="small text-muted">{{ site_url }}</code>
  </div>
  <a href="{{ url_for('admin_qr_indir') }}" class="btn btn-primary">
    <i class="bi bi-download me-1"></i>QR Kodu İndir (PNG)
  </a>
</div>
{% endblock %}
