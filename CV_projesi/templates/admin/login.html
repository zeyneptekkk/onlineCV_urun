<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Girişi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="mb-3">
        <i class="bi bi-shield-lock text-primary" style="font-size:2.5rem;"></i>
      </div>
      <h4 class="fw-700 mb-1">Admin Girişi</h4>
      <p class="text-muted small mb-0">CV yönetim paneline erişmek için giriş yapın</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
      <div class="alert alert-{{ category }} mb-3">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Kullanıcı Adı</label>
        <input type="text" name="kullanici_adi" class="form-control" placeholder="zeynep veya mustafa" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label">Şifre</label>
        <input type="password" name="sifre" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-box-arrow-in-right me-1"></i>Giriş Yap
      </button>
    </form>

    <div class="text-center mt-4">
      <a href="{{ url_for('index') }}" class="text-muted text-decoration-none small">
        <i class="bi bi-arrow-left me-1"></i>Siteye Dön
      </a>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
