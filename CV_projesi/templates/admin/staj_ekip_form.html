{% extends "admin/base.html" %}
{% block title %}{{ baslik }}{% endblock %}

{% block content %}
<div class="admin-header d-flex justify-content-between align-items-center">
  <div>
    <h1>{{ baslik }}</h1>
    <p class="text-muted mb-0">{{ staj.sirket_adi }}</p>
  </div>
  <a href="{{ url_for('admin_staj_ekip', staj_id=staj.id) }}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i>Geri
  </a>
</div>

<div class="form-card">
  <form method="POST" enctype="multipart/form-data">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Ad Soyad *</label>
        <input type="text" name="ad_soyad" class="form-control" required
               value="{{ uye.ad_soyad if uye else '' }}"
               placeholder="Ahmet Yılmaz">
      </div>
      <div class="col-md-6">
        <label class="form-label">Unvan / Görev</label>
        <input type="text" name="unvan" class="form-control"
               value="{{ uye.unvan if uye else '' }}"
               placeholder="Yazılım Geliştirici, Proje Yöneticisi...">
      </div>
      <div class="col-md-6">
        <label class="form-label">Sıra (küçük = önce)</label>
        <input type="number" name="sira" class="form-control" min="0"
               value="{{ uye.sira if uye else 0 }}">
      </div>
      <div class="col-12">
        <label class="form-label">Fotoğraf</label>
        {% if uye and uye.resim %}
        <div class="mb-2">
          <img src="{{ url_for('static', filename='uploads/' + uye.resim) }}"
               style="width:72px;height:72px;object-fit:cover;border-radius:50%;border:2px solid var(--border);">
        </div>
        {% endif %}
        <input type="file" name="resim" class="form-control" accept="image/*">
        <div class="form-text">Ekip üyesinin vesikalık veya profil fotoğrafı.</div>
      </div>
    </div>
    <hr class="my-4">
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-check-lg me-1"></i>Kaydet
      </button>
      <a href="{{ url_for('admin_staj_ekip', staj_id=staj.id) }}" class="btn btn-outline-secondary">İptal</a>
    </div>
  </form>
</div>
{% endblock %}
